services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: agentic_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [crm_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_crm"], interval: 5s, timeout: 3s, retries: 20}
  api:
    build: .
    env_file: .env
    environment: {HOST: 0.0.0.0}
    ports: ["4100:4100"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
  worker:
    build: .
    command: ["node","dist/src/worker.js"]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
volumes: {crm_data: {}}
