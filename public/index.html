<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit CRM</title><link rel="stylesheet" href="/styles.css"></head>
<body><div id="auth" class="auth"><form id="loginForm" class="auth-card"><div class="brand-mark">O</div><h1>Orbit CRM</h1><p>Agentic intelligence. Deterministic control.</p><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button><small id="authError"></small></form></div>
<div id="shell" class="shell hidden"><aside><div class="brand"><span>O</span><div><strong>Orbit</strong><small>Hybrid CRM</small></div></div><nav id="nav"></nav><div class="aside-foot"><button id="logout" class="quiet">Sign out</button></div></aside><main><header><div><small id="crumb">Workspace</small><h1 id="title">Command center</h1></div><div class="header-actions"><button id="refresh" class="quiet">Refresh</button><button id="askAgent">Ask agent</button><div class="avatar" id="avatar">AI</div></div></header><section id="content"></section></main></div>
<dialog id="agentDialog"><form method="dialog" class="dialog-head"><div><small>GROQ · GOVERNED</small><h2>CRM Copilot</h2></div><button>×</button></form><div id="chat" class="chat"><div class="assistant-msg">Ask about accounts, pipeline, prospects, or your knowledge base. Answers include grounded citations when available.</div></div><form id="agentForm" class="composer"><select name="agentType"><option value="assistant">CRM assistant</option><option value="qualification">Lead qualification</option><option value="research">Account research</option><option value="pipeline">Pipeline risk</option><option value="email">Email drafting</option><option value="data_quality">Data quality</option><option value="mcp">MCP tool agent</option></select><textarea name="objective" placeholder="What should the agent investigate?" required></textarea><button>Run</button></form></dialog>
<script type="module" src="/app.js"></script></body></html>
